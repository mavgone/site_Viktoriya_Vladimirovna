<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration — StarBuks</title>
  <link href="../static/css/style.css" rel="stylesheet">
</head>

<body class="page registration-body">

  <header class="site-header">
    <h1 class="logo">StarBuks</h1>

    <nav class="header-nav">
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#atmosphere">Atmosphere</a>
      <a href="index.html#menu">Menu</a>
      <a href="index.html#loyalty">Loyalty</a>
      <a href="index.html#hours">Hours</a>
      <a href="index.html#contacts">Contacts</a>
      <a href="feedback.html" class="nav-link">Feedback</a>
      <a href="animation3.html" class="order-coffee-btn">
        Order a home
      </a>
    </nav>

    <div class="header-actions">
    </div>
  </header>

  <main class="registration-page">

    <section class="registration-box">

      <div class="registration-header">
        <h2>Creating an account</h2>
        <p>Register to become a StarBuks member</p>
      </div>

      <form class="registration-form">

        <div class="registration-group">
          <label class="registration-label" for="name">
            Name
          </label>

          <input class="registration-input" type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div class="registration-group">
          <label class="registration-label" for="email">
            Email
          </label>

          <input class="registration-input" type="email" id="email" name="email" placeholder="Enter your email"
            required>
        </div>

        <div class="registration-group">
          <label class="registration-label" for="password">
            Password
          </label>

          <input class="registration-input" type="password" id="password" name="password"
            placeholder="Enter your password" required>
        </div>

        <div class="registration-group">
          <label class="registration-label" for="password_repeat">
            Confirm password
          </label>

          <input class="registration-input" type="password" id="password_repeat" name="password_repeat"
            placeholder="Repeat your password" required>
        </div>

        <button class="registration-button" type="submit">
          Create account
        </button>

      </form>

      <div class="registration-footer">
        <p>Already have an account?</p>

        <a class="login-link" href="log.html">
          Log in
        </a>
      </div>

    </section>

  </main>

  <footer class="site-footer">

    <p class="footer-item">
      Main office: St-Petersburg, street Random, house 21, office 20
    </p>

    <p class="footer-heading">
      Contacts
    </p>

    <p class="footer-item">
      Telegram:
    </p>

    <p class="footer-item">
      Mail:
    </p>

    <p class="footer-item">
      Phone:
    </p>

  </footer>

</body>

</html>
