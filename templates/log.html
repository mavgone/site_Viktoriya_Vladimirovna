<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — StarBuks</title>
  <link href="../static/css/style.css" rel="stylesheet">
</head>

<body class="page login-body">

  <header class="site-header">
    <h1 class="logo">StarBuks</h1>

    <nav class="header-nav">
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#atmosphere">Atmosphere</a>
      <a href="index.html#menu">Menu</a>
      <a href="index.html#loyalty">Loyalty</a>
      <a href="index.html#hours">Hours</a>
      <a href="index.html#contacts">Contacts</a>
      <a href="feedback.html" class="nav-link">Feedback</a>
      <a href="animation3.html" class="order-coffee-btn">
        Order a home
      </a>
    </nav>

    <div class="header-actions">
    </div>
  </header>

  <main class="login-page">

    <section class="login-box">

      <div class="login-header">
        <h2>Welcome back</h2>
        <p>Log in to your StarBuks account</p>
      </div>

      <form class="login-form">

        <div class="login-group">
          <label class="login-label" for="email">
            Email
          </label>

          <input class="login-input" type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="login-group">
          <label class="login-label" for="password">
            Password
          </label>

          <input class="login-input" type="password" id="password" name="password" placeholder="Enter your password"
            required>
        </div>

        <button class="login-button" type="submit">
          Log in
        </button>

      </form>

      <div class="login-footer">
        <p>Don't have an account?</p>

        <a class="registration-link" href="reg.html">
          Create account
        </a>
      </div>

    </section>

  </main>

  <footer class="site-footer">

    <p class="footer-item">
      Main office: St-Petersburg, street Random, house 21, office 20
    </p>

    <p class="footer-heading">
      Contacts
    </p>

    <p class="footer-item">
      Telegram:
    </p>

    <p class="footer-item">
      Mail:
    </p>

    <p class="footer-item">
      Phone:
    </p>

  </footer>

</body>

</html>
